<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>PowerCards</title>
  </head>
  <body>
    <div id="gameBoard">
      <div id="gameBlock">
        <div id="upHight">
          <div id="hearts">3hearts</div>
          <div id="countOfAnswers">12 good/13 bad</div>
        </div>

        <div class="cardBlock">
          <div class="card" id="cardFront">it is actually card</div>
          <div class="card" id="cardBack">its card`s back</div>
          <button id="nextCard">-></button>
        </div>

        <div id="actionButt">

            i know that!!
          </button>
          <button class="isThisFamiliar" id="unFamiliarCard">
            idk that da fck is that
          </button>
        </div>
      </div>

      <div id="menu">
        <button class="menuBtn" id="toggleMenu">M</button>
        <div id="menuButtons">
          <button class="menuBtn" id="startGame">start new game here</button>
          <button class="menuBtn" id="endGame">stop game here</button>
        </div>
      </div>
    </div>
  </body>
</html>
